services:
  - type: web
    name: relay-enterprise-search
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: MAX_AUDIO_MB
        value: "50"
      - key: DIARIZATION_ENABLED
        value: "false"
      - key: REQUIRE_ACCESS_AUTH
        value: "true"
      - key: RELAY_ACCESS_USERNAME
        sync: false
      - key: RELAY_ACCESS_PASSWORD
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
