services:
  - type: web
    name: relay-enterprise-search
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "12"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
