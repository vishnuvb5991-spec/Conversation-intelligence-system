services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false

  realtime-agent:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    env_file:
      - path: .env
        required: false
    profiles: [realtime]

  app-diarization:
    build:
      context: .
      dockerfile: Dockerfile.diarization
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    profiles: [diarization]

  # Enable with: docker compose --profile realtime up --build
